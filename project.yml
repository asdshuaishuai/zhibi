name: ZhiBi
options:
  bundleIdPrefix: com.zhibi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ZhiBi:
    type: application
    platform: macOS
    sources:
      - path: ZhiBi/Sources
        excludes:
          - "Cli"
    settings:
      base:
        PRODUCT_NAME: 执笔
        PRODUCT_BUNDLE_IDENTIFIER: com.zhibi.app
        INFOPLIST_KEY_CFBundleDisplayName: 执笔
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 执笔"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
  ZhiBiCli:
    type: tool
    platform: macOS
    sources:
      - path: ZhiBi/Sources/Models
      - path: ZhiBi/Sources/Persistence
      - path: ZhiBi/Sources/Services
      - path: ZhiBi/Sources/Prompts
      - path: ZhiBi/Sources/AgentCore
      - path: ZhiBi/Sources/Cli
    settings:
      base:
        PRODUCT_NAME: ZhiBiCli
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  ZhiBiCli:
    build:
      targets:
        ZhiBiCli: all
    run:
      config: Debug
